<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MR.COFFEE - Order</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="images/Mr.jpg" alt="MR.COFFEE Logo" />
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="rewards.html">Rewards</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="order.html" class="active">Order</a></li>
      </ul>
    </nav>
  </header>

  <main class="order-page">
    <h1>Place Your Order</h1>
    <form id="orderForm" action="#" method="POST" class="order-form">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />

      <label for="address">Delivery Address:</label>
      <textarea id="address" name="address" rows="3" required></textarea>

      <label for="coffee">Select item:</label>
      <select id="coffee" name="coffee" required>
        <option value="">-- Choose a Item --</option>
        <option value="Choco Coffee">Choco Coffee</option>
        <option value="frappe">Frappe</option>
        <option value="Fruit Sandwich">Fruit Sandwich</option>
        <option value="Matcha Latte">Matcha Latte</option>
        <option value="Avo Latte">AVO-LATTE</option>
      </select>

      <fieldset class="addons">
        <legend>Add-ons:</legend>
        <label><input type="checkbox" name="addons" value="extra_shot" /> Extra Shot</label>
        <label><input type="checkbox" name="addons" value="whipped_cream" /> Whipped Cream</label>
        <label><input type="checkbox" name="addons" value="caramel_drizzle" /> Caramel Drizzle</label>
        <label><input type="checkbox" name="addons" value="vanilla_syrup" /> Vanilla Syrup</label>
      </fieldset>

      <button type="submit">Submit Order</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 MR.COFFEE - All Rights Reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
